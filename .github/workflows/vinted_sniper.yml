name: Vinted Sniper AI Automation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinted-sniper
  cancel-in-progress: false

jobs:
  run-sniper:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Buforowanie przeglądarki Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalacja bibliotek i Playwrighta
        run: |
          python -m pip install -r requirements.txt
          playwright install chromium

      - name: Uruchomienie Vinted Snajpera
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Zapis historii seen_items.json do repozytorium
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          if git diff --cached --quiet; then
            echo "Brak zmian w historii ofert."
          else
            git commit -m "Update seen listing history [skip ci]"
            git push
          fi